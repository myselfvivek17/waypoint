<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint · plan a celebration, one decision at a time</title>
<meta name="description" content="An AI planning assistant for birthdays, weddings and community events in India.">
<meta name="color-scheme" content="light dark">
<script src="/js/theme-init.js"></script>
<link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:,">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div id="banner"></div>
<header class="hd">
 <div class="wrap hdin">
  <button id="logo" class="logo disp" type="button" aria-label="Waypoint, back to start">Waypoint</button>
  <div class="hdr">
   <nav id="nav" class="nav" aria-label="Planning steps"></nav>
   <button id="help" class="themeb helpb" type="button" aria-label="Help: show me around this screen" title="Show me around"><span aria-hidden="true">?</span></button>
   <button id="theme" class="themeb" type="button" aria-pressed="false"><span id="theme-ic" aria-hidden="true"></span><span id="theme-tx">Dark</span></button>
  </div>
 </div>
</header>
<div id="view" tabindex="-1"></div>
<div id="sheet-root"></div>
<div id="busy" class="busy" hidden>
 <div class="busyin" id="busy-box" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">
  <div id="busy-art" class="busyart" aria-hidden="true"></div>
  <p id="busy-tx" class="disp busytx"></p>
  <p id="busy-sub" class="busysub"></p>
 </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p class="wrap">Waypoint needs JavaScript to run.</p></noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
